    body {

    .container {

      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);

    .day {

      border-radius: 8px;

      font-weight: bold;
      color: #555;
    }
    .has-video {
      background: #dfe6e9;
      cursor: pointer;
    }
    .has-video:hover {
      background: #cfd8dc;
    }
    a { text-decoration: none; color: inherit; }
  </style>
</head>
