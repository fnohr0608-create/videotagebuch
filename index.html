<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Für Marie, weil ich so viel zu sagen hab, aber mir nichts merken kann</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    .month {
      margin-bottom: 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }
    .day {
      background: #eee;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      position: relative;
      font-weight: bold;
      color: #555;
    }
    .has-entry {
      background: #dfe6e9;
      cursor: pointer;
    }
    .has-entry:hover {
      background: #cfd8dc;
    }
    .preview {
      display: none;
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      width: 180px;
      z-index: 10;
    }
    .has-entry:hover .preview {
      display: block;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>

<body>
<div class="container">
  <h2>August 2025 – August 2026</h2>
  <div id="calendar"></div>
</div>

<!-- EINZIGE Datenquelle -->
<script src="data/days.js"></script>

<script>
const calendar = document.getElementById("calendar");

function createMonth(year, month) {
  const monthDiv = document.createElement("div");
  monthDiv.className = "month";

  const title = document.createElement("h3");
  title.textContent = new Date(year, month).toLocaleString(
    "de-DE",
    { month: "long", year: "numeric" }
  );
  monthDiv.appendChild(title);

  const grid = document.createElement("div");
  grid.className = "grid";

  const firstDay = new Date(year, month, 1).getDay(); // Sonntag = 0
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // Leere Felder vor dem 1. Tag (Mo-Start)
  const offset = (firstDay + 6) % 7;
  for (let i = 0; i < offset; i++) {
    grid.appendChild(document.createElement("div"));
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr =
      `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

    const dayDiv = document.createElement("div");
    dayDiv.className = "day";

    if (days[dateStr]) {
      dayDiv.classList.add("has-entry");

      // 🔹 HOVER-TEXT (Beschreibung)
      const previewDiv = document.createElement("div");
      previewDiv.className = "preview";
      previewDiv.textContent = days[dateStr].description;
      dayDiv.appendChild(previewDiv);

      // 🔹 Klickbarer Link zur Tagesseite
      const link = document.createElement("a");
      link.href = `day.html?date=${dateStr}`;
      link.textContent = day;
      dayDiv.appendChild(link);
    } else {
      dayDiv.textContent = day;
    }

    grid.appendChild(dayDiv);
  }

  monthDiv.appendChild(grid);
  calendar.appendChild(monthDiv);
}

// 🔹 Kalender von August 2025 bis August 2026
for (let year = 2025; year <= 2026; year++) {
  const startMonth = year === 2025 ? 7 : 0;
  const endMonth = year === 2026 ? 7 : 11;

  for (let month = startMonth; month <= endMonth; month++) {
    createMonth(year, month);
  }
}
</script>
